name: DailyQCM

options:
  bundleIdPrefix: com.dailyqcm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  DailyQCM:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DailyQCM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DailyQCM/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyqcm.app
        PRODUCT_NAME: DailyQCM
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  DailyQCMTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/DailyQCMTests
    dependencies:
      - target: DailyQCM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyqcm.app.tests
        GENERATE_INFOPLIST_FILE: YES
        # Host the tests in the app so `@testable import DailyQCM` links.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DailyQCM.app/DailyQCM"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DailyQCM:
    build:
      targets:
        DailyQCM: all
        DailyQCMTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DailyQCMTests
