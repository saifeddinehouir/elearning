name: CI

# Builds DailyQCM and runs the XCTest suite on a GitHub-hosted macOS runner.
# No local Mac required — push to GitHub and watch the run under the "Actions" tab.
#
# NOTE ON PATHS: this file assumes the `quiz_qpp` folder is the repository root
# (i.e. `project.yml` sits next to this `.github/` directory). If instead
# `quiz_qpp` is nested inside a larger repo, move `.github/` to the repo root and
# add `defaults: { run: { working-directory: quiz_qpp } }` to the job below.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: PWA — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (SM-2 / session / streak / schema)
        working-directory: pwa
        run: node --test
      - name: Icon generator runs
        working-directory: pwa
        run: node tools/make-icons.mjs

  build-test:
    name: Native — build & unit test (iOS Simulator)
    runs-on: macos-latest

    env:
      SCHEME: DailyQCM
      PROJECT: DailyQCM.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        run: |
          LINE=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone .*\(')
          NAME=$(echo "$LINE" | sed -E 's/^[[:space:]]+(iPhone [^(]+) \(.*/\1/' | sed -E 's/[[:space:]]+$//')
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator found; listing what's available:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "DESTINATION=platform=iOS Simulator,name=$NAME,OS=latest" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
