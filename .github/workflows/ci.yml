name: CI

# Builds DailyQCM and runs the XCTest suite on a GitHub-hosted macOS runner.
# No local Mac required — push to GitHub and watch the run under the "Actions" tab.
#
# NOTE ON PATHS: this file assumes the `quiz_qpp` folder is the repository root
# (i.e. `project.yml` sits next to this `.github/` directory). If instead
# `quiz_qpp` is nested inside a larger repo, move `.github/` to the repo root and
# add `defaults: { run: { working-directory: quiz_qpp } }` to the job below.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: PWA — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (SM-2 / session / streak / schema)
        working-directory: pwa
        run: node --test
      - name: Icon generator runs
        working-directory: pwa
        run: node tools/make-icons.mjs

  build-test:
    name: Native — build & unit test (iOS Simulator)
    runs-on: macos-14

    env:
      SCHEME: DailyQCM
      PROJECT: DailyQCM.xcodeproj
      # Any always-present simulator on the Xcode 15.x runner image.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 15,OS=latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
